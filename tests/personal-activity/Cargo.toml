[package]
name = "personal-activity-harness"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "=0.4.45", features = ["serde"] }
rusqlite = { version = "=0.39.0", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "=1.26.1", features = ["v4"] }

[[test]]
name = "personal-activity"
path = "harness.rs"
