[package]
name = "hanni-mvp"
version = "0.2.2"
edition = "2021"
rust-version = "1.98"

[lib]
name = "hanni_mvp_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "=0.39.0", features = ["bundled", "backup", "fallible_uint"] }
uuid = { version = "1", features = ["v4"] }

reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
chacha20poly1305 = "0.10"
rand = "0.9"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "=2.11.1", features = ["test"] }
