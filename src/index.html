<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hanni MVP</title>
<script src="/theme-boot.js"></script>
<link rel="stylesheet" href="/hljs-theme.css">
<script src="/highlight.min.js"></script>
<script src="/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
</head>
<body>
<div id="drag-region"></div>
<div id="app-body">
  <div id="mobile-header">
    <button id="mobile-hamburger" aria-label="Открыть меню"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <span id="mobile-title">Hanni MVP</span>
  </div>
  <div id="tab-bar"><div id="tab-list"></div><div id="tab-bar-bottom"></div></div>
  <div id="content-area">
    <div id="view-calendar" class="view active"><div id="calendar-content" class="tab-content"></div></div>
  </div>
</div>
<div id="mvp-alert" class="mvp-alert" role="alert" hidden><span></span><button type="button">Закрыть</button></div>
<dialog id="mvp-settings" class="mvp-settings" aria-labelledby="mvp-settings-title">
  <h2 id="mvp-settings-title">Hanni MVP</h2>
  <label>Тема <select id="mvp-theme"><option value="light">Светлая</option><option value="dark">Тёмная</option></select></label>
  <p>Календарь · <span class="version-label">v0.2.0</span></p>
  <p id="mvp-backup-result" role="status"></p>
  <footer><button id="mvp-backup" type="button">Создать резервную копию</button><button id="mvp-settings-close" type="button">Закрыть</button></footer>
</dialog>
<script src="/vendor/editorjs.min.js"></script>
<script src="/vendor/header.min.js"></script>
<script src="/vendor/list.min.js"></script>
<script src="/vendor/checklist.min.js"></script>
<script src="/vendor/quote.min.js"></script>
<script src="/vendor/code.min.js"></script>
<script src="/vendor/delimiter.min.js"></script>
<script src="/vendor/marker.min.js"></script>
<script src="/vendor/inline-code.min.js"></script>
<script src="/vendor/drag-drop.min.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
