name: macOS isolated QA candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-qa:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - name: Isolate the application identity and frontend origin
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path('src-tauri/tauri.conf.json').read_text())
          window = config['app']['windows'][0]
          window.update(title='Cicada Execution QA')
          override = {'identifier': 'app.hanni.mvp.qa.exec' + os.environ['GITHUB_SHA'][:8],
                      'build': {'devUrl': 'http://127.0.0.1:1447'},
                      'app': {'windows': [window]}}
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('TAURI_CONFIG=' + json.dumps(override) + '\n')
          PY
      - name: Build debug runtime with isolated-profile support
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked
      - name: Identify the QA binary
        shell: bash
        run: |
          mkdir -p .local/macos-qa
          python3 - <<'PY'
          import hashlib, json, os, platform, plistlib, shutil, subprocess
          from pathlib import Path
          root = Path('.local/macos-qa')
          config = json.loads(Path('src-tauri/tauri.conf.json').read_text())
          override = json.loads(os.environ['TAURI_CONFIG'])
          bundle = root / 'Cicada Execution QA.app'
          binary = bundle / 'Contents/MacOS/hanni-mvp'
          binary.parent.mkdir(parents=True)
          shutil.copy2('src-tauri/target/debug/hanni-mvp', binary)
          with (bundle / 'Contents/Info.plist').open('wb') as stream:
              plistlib.dump({'CFBundleExecutable': 'hanni-mvp',
                            'CFBundleIdentifier': override['identifier'],
                            'CFBundleName': 'Cicada Execution QA',
                            'CFBundlePackageType': 'APPL',
                            'CFBundleShortVersionString': config['version'],
                            'CFBundleVersion': config['version'],
                            'LSUIElement': True,
                            'NSHighResolutionCapable': True}, stream)
          subprocess.run(['codesign', '--force', '--sign', '-', str(bundle)], check=True)
          subprocess.run(['codesign', '--verify', '--deep', '--strict', str(bundle)], check=True)
          (root / 'manifest.json').write_text(json.dumps({
              'source_commit': os.environ['GITHUB_SHA'],
              'version': config['version'],
              'architecture': platform.machine(),
              'profile': 'debug; isolated data directory; local Vite frontend',
              'binary': str(binary.relative_to(root)),
              'sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
              'production_install': False,
              'qa_config': json.loads(os.environ['TAURI_CONFIG']),
          }, indent=2) + '\n')
          PY
          ditto -c -k .local/macos-qa .local/macos-qa.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hanni-mvp-macos-qa-${{ github.sha }}
          path: .local/macos-qa.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
