name: Goals 85 cloud render
on:
  workflow_dispatch:
  push:
    branches: [work/goals85-text-actions-01a14f82]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source publication guards
        run: |
          python3 -B scripts/check-private-data.py
          python3 -B scripts/check-public-history.py
      - name: Prepare isolated browser tooling on hosted cloud runner
        run: |
          npm install --prefix "$RUNNER_TEMP/goals85-tools" --no-save --package-lock=false playwright@1.62.1
          chrome_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$chrome_path" ]; then
            "$chrome_path" --version
            echo "GOALS85_CHROME=$chrome_path" >> "$GITHUB_ENV"
          else
            "$RUNNER_TEMP/goals85-tools/node_modules/.bin/playwright" install --with-deps chromium --only-shell
          fi
      - name: Render actual workspace with fictional data
        env:
          NODE_PATH: ${{ runner.temp }}/goals85-tools/node_modules
        run: node scripts/qa-goals85-render.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goals85-render-${{ github.sha }}
          path: .local/goals85-render/
          if-no-files-found: error
          retention-days: 3
