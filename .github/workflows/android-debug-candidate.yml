name: Android debug candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      BUILD_TOOLS_VERSION: 35.0.0
      NDK_VERSION: 28.2.13676358
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-linux-android
      - name: Install pinned Android SDK components
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          sdkmanager_exit=${PIPESTATUS[1]}
          set -o pipefail
          test "$sdkmanager_exit" -eq 0
          "$sdkmanager" "platforms;android-36" "build-tools;$BUILD_TOOLS_VERSION" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Check package helper parsing
        run: python3 -m unittest tests/test_package_android_debug.py
      - name: Build debug candidate
        run: python3 scripts/package-android-debug.py
      - id: artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hanni-mvp-android-debug-candidate-${{ github.sha }}
          path: .local/android-package/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - id: draft_release
        if: steps.artifact.outcome == 'failure'
        continue-on-error: true
        name: Save draft-release fallback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(.local/android-package/*/*.apk .local/android-package/*/manifest.json)
          test "${#assets[@]}" -eq 2
          tag="android-candidate-${GITHUB_RUN_ID}"
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --draft \
            --latest=false \
            --title "Cicada Android debug candidate ${GITHUB_RUN_ID}" \
            --notes "CI delivery fallback. Debug-signed candidate only; it is not an authorised update."
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')" = "$GITHUB_SHA"
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" -eq 2
      - name: Require a delivery channel
        if: always()
        shell: bash
        run: |
          artifact_outcome="${{ steps.artifact.outcome }}"
          release_outcome="${{ steps.draft_release.outcome }}"
          if [[ "$artifact_outcome" == 'success' || "$release_outcome" == 'success' ]]; then
            exit 0
          fi
          echo "Neither artifact storage nor the draft release accepted the candidate."
          exit 1
