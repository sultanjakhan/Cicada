name: Ordinary note create replay cloud checks
on:
  workflow_dispatch:
  push:
    branches: [work/2a8163f8-note-create-01a14f82]
permissions:
  contents: read
jobs:
  dom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set -e
          date -u +%FT%TZ
          uname -s
          pwd
          git rev-parse HEAD HEAD^{tree}
          python3 -B scripts/check-private-data.py
          python3 -B scripts/check-public-history.py
          npm install --prefix "$RUNNER_TEMP/note-tools" --no-save --package-lock=false jsdom@29.1.1
      - name: Ordinary saves, lost acknowledgement, reconciliation and retained rich draft
        env:
          NODE_PATH: ${{ runner.temp }}/note-tools/node_modules
        run: node --test tests/upstream-calendar-notes.test.cjs
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: src-tauri -> target
      - name: Existing Tauri Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Focused atomic persistence, concurrent replay and public IPC checks
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked ordinary_note_attempt -- --nocapture
