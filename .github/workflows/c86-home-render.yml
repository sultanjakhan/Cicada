name: C86 Home report hierarchy cloud render
on:
  workflow_dispatch:
  push:
    branches: [work/c86-home-reports-01a14f82]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source guards
        run: |
          set -e
          date -u +%FT%TZ
          git rev-parse HEAD HEAD^{tree}
          python3 -B scripts/check-private-data.py
          python3 -B scripts/check-public-history.py
      - name: Pinned isolated cloud tooling
        run: |
          set -e
          npm install --prefix "$RUNNER_TEMP/c86-tools" --no-save --package-lock=false playwright@1.62.1 jsdom@29.1.1
          chrome_path="$(command -v google-chrome)"
          "$chrome_path" --version
          echo "C86_CHROME=$chrome_path" >> "$GITHUB_ENV"
          ln -s "$RUNNER_TEMP/c86-tools/node_modules" node_modules
      - name: Existing Home baseline render
        env:
          NODE_PATH: ${{ runner.temp }}/c86-tools/node_modules
          C86_LABEL: baseline
        run: node scripts/qa-c86-home-render.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c86-home-${{ github.sha }}
          path: .local/c86-render/
          if-no-files-found: error
          retention-days: 3
