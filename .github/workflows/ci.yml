name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run check:privacy
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm ci
        working-directory: sync-relay
      - run: npm test
        working-directory: sync-relay
      - run: npm run test:native
        working-directory: sync-relay
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm.cmd ci
      - run: npm.cmd run check:vendor
      - run: npm.cmd audit --audit-level=low
      - run: .\scripts\audit-rust.ps1
      - run: npm.cmd test
      - run: npm.cmd run check:privacy
      - run: npm.cmd run build
      - run: cargo test --locked
        working-directory: src-tauri
      - run: .\scripts\package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: hanni-mvp-windows-${{ github.sha }}
          path: .local/windows-package/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
