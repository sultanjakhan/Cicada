name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B scripts/check-private-data.py
      - run: python -B scripts/check-public-history.py
      - run: python -B -m unittest discover -s tests -p 'test*privacy*.py'
      - run: python -B -m unittest discover -s tests -p test_public_history.py
      - name: Package matching Cicada MCP client
        run: python3 scripts/package-cicada-plugin.py --client-version 0.5.2
      - name: Check compatible seven-tool MCP client and guarded flat upgrade
        run: |
          python -B plugins/cicada-tasks/cicada-local-tasks-0.5.1/tests/test_package.py
          python -B plugins/cicada-tasks/cicada-local-tasks-0.5.1/tests/test_installer.py
          python -B plugins/cicada-tasks/test_flat_upgrade.py
          python -B plugins/cicada-tasks/cicada-local-tasks-0.5.2/tests/test_package.py
          python -B plugins/cicada-tasks/cicada-local-tasks-0.5.2/tests/test_mac_transport.py
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: cicada-local-tasks-${{ github.sha }}
          path: .local/plugin-package/**/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
  mac:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use a physical temporary directory outside the checkout
        run: |
          task_tmp="$(cd "$GITHUB_WORKSPACE/.." && pwd -P)/cicada-ci-temp"
          mkdir -p "$task_tmp"
          echo "TMPDIR=$task_tmp" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sync-relay/package-lock.json
            update-service/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri -> target
          shared-key: cicada-tauri
      - run: npm ci
      - run: npm test
        timeout-minutes: 5
      - run: npm audit --audit-level=low
      - run: npm run check:privacy
      - run: npm run build
      - name: Check portable macOS client and synthetic UDS rejection paths
        run: |
          python -B plugins/cicada-tasks/cicada-local-tasks-0.5.2/tests/test_package.py
          python -B plugins/cicada-tasks/cicada-local-tasks-0.5.2/tests/test_mac_transport.py
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Check updater archive security and compatibility
        run: cargo test --manifest-path tests/updater-archive/Cargo.toml --locked
      - name: Check standalone activity summary
        run: cargo test --manifest-path tests/activity-summary/Cargo.toml --locked
      - run: npm ci
        working-directory: sync-relay
      - run: npm test
        timeout-minutes: 5
        working-directory: sync-relay
      - run: npm audit --audit-level=low
        working-directory: sync-relay
      - run: npm ci
        working-directory: update-service
      - run: npm test
        timeout-minutes: 5
        working-directory: update-service
      - run: npm audit --audit-level=low
        working-directory: update-service
      - run: npm run test:native
        working-directory: sync-relay
      - run: npm run test:native:checkpoint
        working-directory: sync-relay
      - run: npm run package:mac
      - name: Report candidate identity and hashes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.local/mac-package').glob('*/manifest.json'):
              manifest = json.loads(path.read_text())
              print(json.dumps({key: manifest[key] for key in
                    ('application','identifier','version','platform','source_commit',
                     'archive','archive_sha256','signing','notarized')}, sort_keys=True))
              print(json.dumps({'executable_sha256': manifest['files_sha256']['Contents/MacOS/hanni-mvp']}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        # Optional CI bundle; signed release delivery is enforced separately.
        continue-on-error: true
        with:
          name: hanni-mvp-macos-${{ github.sha }}
          path: |
            .local/mac-package/**/*.zip
            .local/mac-package/**/manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  test:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      HANNI_MVP_UPDATES_URL: ${{ secrets.MVP_UPDATES_URL }}
      HANNI_MVP_UPDATES_TOKEN: ${{ secrets.MVP_UPDATES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sync-relay/package-lock.json
            update-service/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri -> target
          shared-key: cicada-tauri
      - run: python -m pip install pywin32==311 psutil==7.1.3
      - name: Check portable Cicada task plugin instructions
        run: python -B plugins/cicada-tasks/cicada-local-tasks-0.5.0/tests/test_package.py
      - name: Check portable client preserves Windows pipe behavior
        run: |
          python -B plugins/cicada-tasks/cicada-local-tasks-0.5.2/tests/test_package.py
          python -B plugins/cicada-tasks/cicada-local-tasks-0.5.2/tests/test_mac_transport.py
      - name: Check preservation during local plugin upgrade
        run: python -B plugins/cicada-tasks/test_upgrade_048.py
      - name: Check plugin upgrade to 0.5.0
        run: python -B plugins/cicada-tasks/test_upgrade_050.py
      - name: Check new local plugin installation
        run: python -B plugins/cicada-tasks/cicada-local-tasks-0.5.0/tests/test_installer.py
      - run: npm.cmd ci
      - run: npm.cmd run check:vendor
      - run: npm.cmd audit --audit-level=low
      - run: .\scripts\audit-rust.ps1
      - run: npm.cmd test
        timeout-minutes: 5
      - run: npm.cmd run check:privacy
      - run: npm.cmd run build
      - run: npm.cmd ci
        working-directory: sync-relay
      - run: npm.cmd test
        timeout-minutes: 5
        working-directory: sync-relay
      - run: npm.cmd audit --audit-level=low
        working-directory: sync-relay
      - run: npm.cmd ci
        working-directory: update-service
      - run: npm.cmd test
        timeout-minutes: 5
        working-directory: update-service
      - run: npm.cmd audit --audit-level=low
        working-directory: update-service
      - run: cargo test --locked
        working-directory: src-tauri
      - name: Check updater archive security and compatibility
        run: cargo test --manifest-path tests/updater-archive/Cargo.toml --locked
      - name: Check standalone activity summary
        run: cargo test --manifest-path tests/activity-summary/Cargo.toml --locked
      - if: github.event_name == 'push'
        run: .\scripts\package-windows.ps1
      - uses: actions/upload-artifact@v4
        # Optional CI bundle; signed release delivery is enforced separately.
        continue-on-error: true
        with:
          name: hanni-mvp-windows-${{ github.sha }}
          path: .local/windows-package/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
