name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B scripts/check-private-data.py
      - run: python -B scripts/check-public-history.py
      - run: python -B -m unittest discover -s tests -p 'test*privacy*.py'
      - run: python -B -m unittest discover -s tests -p test_public_history.py
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sync-relay/package-lock.json
            update-service/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri -> target
          shared-key: cicada-tauri
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=low
      - run: npm run check:privacy
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm ci
        working-directory: sync-relay
      - run: npm test
        working-directory: sync-relay
      - run: npm audit --audit-level=low
        working-directory: sync-relay
      - run: npm ci
        working-directory: update-service
      - run: npm test
        working-directory: update-service
      - run: npm audit --audit-level=low
        working-directory: update-service
      - run: npm run test:native
        working-directory: sync-relay
      - run: npm run test:native:checkpoint
        working-directory: sync-relay
      - run: npm run package:mac
      - uses: actions/upload-artifact@v4
        # Optional CI bundle; signed release delivery is enforced separately.
        continue-on-error: true
        with:
          name: hanni-mvp-macos-${{ github.sha }}
          path: |
            .local/mac-package/**/*.zip
            .local/mac-package/**/manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sync-relay/package-lock.json
            update-service/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri -> target
          shared-key: cicada-tauri
      - run: npm.cmd ci
      - run: npm.cmd run check:vendor
      - run: npm.cmd audit --audit-level=low
      - run: .\scripts\audit-rust.ps1
      - run: npm.cmd test
      - run: npm.cmd run check:privacy
      - run: npm.cmd run build
      - run: npm.cmd ci
        working-directory: sync-relay
      - run: npm.cmd test
        working-directory: sync-relay
      - run: npm.cmd audit --audit-level=low
        working-directory: sync-relay
      - run: npm.cmd ci
        working-directory: update-service
      - run: npm.cmd test
        working-directory: update-service
      - run: npm.cmd audit --audit-level=low
        working-directory: update-service
      - run: cargo test --locked
        working-directory: src-tauri
      - run: .\scripts\package-windows.ps1
      - uses: actions/upload-artifact@v4
        # Optional CI bundle; signed release delivery is enforced separately.
        continue-on-error: true
        with:
          name: hanni-mvp-windows-${{ github.sha }}
          path: .local/windows-package/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
