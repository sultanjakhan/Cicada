name: Signed update candidate

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to package
        type: choice
        default: all
        options: [all, windows, android, macos]

permissions:
  contents: read

jobs:
  trusted-source:
    # workflow_run has secrets/write privileges: never consume PR artifacts or
    # use github.sha (the default branch tip) instead of the tested head SHA.
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      platform: ${{ steps.source.outputs.platform }}
    steps:
      - id: source
        name: Validate trusted source before starting any signing job
        shell: python
        run: |
          import json, os, re
          from pathlib import Path

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          repository = event.get('repository', {})
          def require(condition):
              if not condition:
                  raise SystemExit('Refusing untrusted signing source')

          require(os.environ['GITHUB_REPOSITORY'] == 'sultanjakhan/Cicada')
          require(repository.get('full_name') == 'sultanjakhan/Cicada')
          require(str(repository.get('id')) == os.environ['GITHUB_REPOSITORY_ID'])
          require(repository.get('fork') is False)
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_run':
              run = event.get('workflow_run', {})
              head_repository = run.get('head_repository') or {}
              require(event.get('action') == 'completed')
              require(run.get('status') == 'completed' and run.get('conclusion') == 'success')
              require(run.get('event') == 'push' and run.get('head_branch') == 'main')
              require(run.get('name') == 'CI' and run.get('path') == '.github/workflows/ci.yml')
              require(head_repository.get('id') == repository.get('id'))
              require(head_repository.get('full_name') == repository.get('full_name'))
              require(head_repository.get('fork') is False)
              sha, platform = run.get('head_sha', ''), 'all'
          else:
              require(os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch')
              require(os.environ['GITHUB_REF'] == 'refs/heads/main')
              sha = os.environ['GITHUB_SHA']
              platform = (event.get('inputs') or {}).get('platform', 'all')
          require(isinstance(sha, str) and re.fullmatch(r'[0-9a-f]{40}', sha))
          require(platform in ('all', 'windows', 'android', 'macos'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'sha={sha}\nplatform={platform}\n')

  windows:
    needs: trusted-source
    if: needs.trusted-source.outputs.platform == 'all' || needs.trusted-source.outputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CANDIDATE_SHA: ${{ needs.trusted-source.outputs.sha }}
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      MVP_UPDATER_PRIVATE_KEY: ${{ secrets.MVP_UPDATER_PRIVATE_KEY }}
      MVP_UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.MVP_UPDATER_PRIVATE_KEY_PASSWORD }}
      HANNI_MVP_UPDATES_URL: ${{ secrets.MVP_UPDATES_URL }}
      HANNI_MVP_UPDATES_TOKEN: ${{ secrets.MVP_UPDATES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.trusted-source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: python -m pip install pywin32==311 psutil==7.1.3
      - run: npm.cmd ci
      - run: npm.cmd test
        timeout-minutes: 5
      - run: npm.cmd run check:privacy
      - run: npm.cmd run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build and sign Windows candidate
        run: python scripts/package-update.py windows
      - id: artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cicada-update-windows-${{ needs.trusted-source.outputs.sha }}
          path: .local/update-candidate/windows/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - id: draft_release
        if: steps.artifact.outcome == 'failure'
        continue-on-error: true
        name: Draft-release fallback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(.local/update-candidate/windows/*)
          test "${#assets[@]}" -eq 3
          tag="windows-update-candidate-${GITHUB_RUN_ID}"
          gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$CANDIDATE_SHA" --draft --latest=false --title "Cicada Windows update candidate ${GITHUB_RUN_ID}" --notes "CI delivery fallback; not published."
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')" = "$CANDIDATE_SHA"
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" -eq 3
      - name: Require candidate delivery
        if: always()
        shell: bash
        run: |
          test "${{ steps.artifact.outcome }}" = success || test "${{ steps.draft_release.outcome }}" = success

  android:
    needs: trusted-source
    if: needs.trusted-source.outputs.platform == 'all' || needs.trusted-source.outputs.platform == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      CANDIDATE_SHA: ${{ needs.trusted-source.outputs.sha }}
      BUILD_TOOLS_VERSION: 35.0.0
      NDK_VERSION: 28.2.13676358
      MVP_UPDATER_PRIVATE_KEY: ${{ secrets.MVP_UPDATER_PRIVATE_KEY }}
      MVP_UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.MVP_UPDATER_PRIVATE_KEY_PASSWORD }}
      MVP_ANDROID_KEYSTORE_BASE64: ${{ secrets.MVP_ANDROID_KEYSTORE_BASE64 }}
      HANNI_MVP_UPDATES_URL: ${{ secrets.MVP_UPDATES_URL }}
      HANNI_MVP_UPDATES_TOKEN: ${{ secrets.MVP_UPDATES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.trusted-source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Install pinned Android SDK components
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          test "${PIPESTATUS[1]}" -eq 0
          set -o pipefail
          "$sdkmanager" "platforms;android-36" "build-tools;$BUILD_TOOLS_VERSION" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Restore persistent Hanni MVP Android signer
        shell: bash
        run: |
          test -n "$MVP_ANDROID_KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          printf '%s' "$MVP_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          test "$(keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -v | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')" = e18482039bc199a158847aaae9298b9aeb9e8e0e9f0ec2f1e4dcd4ae14e0bd9d
          echo "MVP_ANDROID_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - run: npm run check:privacy
      - run: npm run build
      - name: Build and sign Android candidate
        run: python3 scripts/package-update.py android
      - name: Run Android installer plugin unit tests
        shell: bash
        run: |
          module="$(cd src-tauri/gen/android && ./gradlew projects --console=plain | sed -n 's/.*\(:hanni-mvp-android-installer\).*/\1/p' | head -n 1)"
          test -n "$module"
          (cd src-tauri/gen/android && ./gradlew "$module:testDebugUnitTest" --console=plain)
      - id: artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cicada-update-android-${{ needs.trusted-source.outputs.sha }}
          path: .local/update-candidate/android/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - id: draft_release
        if: steps.artifact.outcome == 'failure'
        continue-on-error: true
        name: Draft-release fallback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(.local/update-candidate/android/*)
          test "${#assets[@]}" -eq 3
          tag="android-update-candidate-${GITHUB_RUN_ID}"
          gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$CANDIDATE_SHA" --draft --latest=false --title "Cicada Android update candidate ${GITHUB_RUN_ID}" --notes "CI delivery fallback; not published."
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')" = "$CANDIDATE_SHA"
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" -eq 3
      - name: Require candidate delivery
        if: always()
        shell: bash
        run: |
          test "${{ steps.artifact.outcome }}" = success || test "${{ steps.draft_release.outcome }}" = success

  macos:
    needs: trusted-source
    if: needs.trusted-source.outputs.platform == 'all' || needs.trusted-source.outputs.platform == 'macos'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CANDIDATE_SHA: ${{ needs.trusted-source.outputs.sha }}
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      MVP_UPDATER_PRIVATE_KEY: ${{ secrets.MVP_UPDATER_PRIVATE_KEY }}
      MVP_UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.MVP_UPDATER_PRIVATE_KEY_PASSWORD }}
      HANNI_MVP_UPDATES_URL: ${{ secrets.MVP_UPDATES_URL }}
      HANNI_MVP_UPDATES_TOKEN: ${{ secrets.MVP_UPDATES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.trusted-source.outputs.sha }}
          persist-credentials: false
      - name: Use a physical temporary directory outside the checkout
        run: |
          task_tmp="$(cd "$GITHUB_WORKSPACE/.." && pwd -P)/cicada-ci-temp"
          mkdir -p "$task_tmp"
          echo "TMPDIR=$task_tmp" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - run: npm test
      - run: npm run check:privacy
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: python3 -m unittest discover -s tests -p 'test_mac_archive.py'
      - name: Build and sign macOS candidate
        run: python3 scripts/package-update.py macos
      - id: artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cicada-update-macos-${{ needs.trusted-source.outputs.sha }}
          path: .local/update-candidate/macos/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - id: draft_release
        if: steps.artifact.outcome == 'failure'
        continue-on-error: true
        name: Draft-release fallback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(.local/update-candidate/macos/*)
          test "${#assets[@]}" -eq 3
          tag="macos-update-candidate-${GITHUB_RUN_ID}"
          gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$CANDIDATE_SHA" --draft --latest=false --title "Cicada macOS update candidate ${GITHUB_RUN_ID}" --notes "CI delivery fallback; not published."
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')" = "$CANDIDATE_SHA"
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" -eq 3
      - name: Require candidate delivery
        if: always()
        shell: bash
        run: |
          test "${{ steps.artifact.outcome }}" = success || test "${{ steps.draft_release.outcome }}" = success
