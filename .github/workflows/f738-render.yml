name: F738 Today production route cloud render
on:
  workflow_dispatch:
  push:
    branches: [work/f738-today-empty-01a1502a]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact candidate guards
        shell: bash
        run: |
          set -euo pipefail
          date -u +%FT%TZ
          pwd
          git rev-parse HEAD HEAD^{tree}
          test -z "$(git status --porcelain=v1)"
          python3 -B scripts/check-private-data.py
          python3 -B scripts/check-public-history.py
          printf '%s %s %s %s\n' refs/heads/candidate "$(git rev-parse HEAD)" refs/heads/candidate 0000000000000000000000000000000000000000 | sh .githooks/pre-push
      - name: Prepare isolated pinned tooling and existing hosted Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/f738-tools" --no-save --package-lock=false playwright@1.62.1 jsdom@29.1.1
          chrome_path="$(command -v google-chrome)"
          "$chrome_path" --version
          echo "F738_CHROME=$chrome_path" >> "$GITHUB_ENV"
      - name: Check production Home and Today paths
        env:
          NODE_PATH: ${{ runner.temp }}/f738-tools/node_modules
        run: node scripts/qa-f738-render.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f738-render-${{ github.sha }}
          path: .local/f738-render/
          if-no-files-found: error
          retention-days: 3
