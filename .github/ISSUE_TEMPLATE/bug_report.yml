name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Issues in English or Russian are welcome.
        Security problems go through the private report described in SECURITY.md, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cicada version
      description: Shown in Settings, or the release you installed.
      placeholder: "0.3.28"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Android
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or error text
      description: Optional. Remove personal data before attaching.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: The report contains no personal data, tasks or notes I do not want to publish.
          required: true
